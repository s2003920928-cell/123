<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>聯絡我們</title>
</head>
<body>
  <nav>
    <a href="index.html">首頁</a> | 
    <a href="about.html">公司介紹</a> | 
    <a href="contact.html">聯絡我們</a>
  </nav>

  <h1>聯絡我們</h1>

  <!-- 表單送出時透過 JavaScript 拋送到 Google App -->
  <form id="contactForm">
    <div>
      <label for="name">姓名：</label>
      <input type="text" id="name" name="name" required>
    </div>
    <br>
    <div>
      <label for="phone">電話：</label>
      <input type="tel" id="phone" name="phone" required>
    </div>
    <br>
    <div>
      <label for="email">EMAIL：</label>
      <input type="email" id="email" name="email" required>
    </div>
    <br>
    <div>
      <label for="message">聯絡內容：</label><br>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>
    <br>
    <button type="submit" id="submitBtn">送出</button>
  </form>

  <p id="statusMsg" style="color: green; font-weight: bold;"></p>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycby6ySzfyH2yMZXCCcaSCVQ-KKioDPn_PBsO0jED-9FxTW7HN650Ulb99vBtSS58BQ/exec';
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', e => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = '寄送中...';

      // 使用 no-cors 模式發送，避開瀏覽器跨域阻擋
      fetch(scriptURL, { 
        method: 'POST', 
        mode: 'no-cors',
        body: new FormData(form)
      })
      .then(response => {
        statusMsg.style.color = 'green';
        statusMsg.textContent = '感謝您的填寫！表單已成功送出，我們將盡快與您聯繫。';
        form.reset();
        submitBtn.disabled = false;
        submitBtn.textContent = '送出';
      })
      .catch(error => {
        console.error('Error!', error);
        statusMsg.style.color = 'red';
        statusMsg.textContent = '發送失敗，請稍後再試。';
        submitBtn.disabled = false;
        submitBtn.textContent = '送出';
      });
    });
  </script>
</body>
</html>
