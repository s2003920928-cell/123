<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>聯絡我們</title>
</head>
<body>
  <nav>
    <a href="index.html">首頁</a> | 
    <a href="about.html">公司介紹</a> | 
    <a href="contact.html">聯絡我們</a>
  </nav>

  <h1>聯絡我們</h1>

  <!-- 表單送出時透過 JavaScript 拋送到 Google App -->
  <form id="contactForm">
    <div>
      <label for="name">姓名：</label>
      <input type="text" id="name" name="name" required>
    </div>
    <br>
    <div>
      <label for="phone">電話：</label>
      <input type="tel" id="phone" name="phone" required>
    </div>
    <br>
    <div>
      <label for="email">EMAIL：</label>
      <input type="email" id="email" name="email" required>
    </div>
    <br>
    <div>
      <label for="message">聯絡內容：</label><br>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>
    <br>
    <button type="submit" id="submitBtn">送出</button>
  </form>

  <p id="statusMsg" style="color: green; font-weight: bold;"></p>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbw7MP-tQj4m0tU6cIQdsk4EB0gRUbXaW1DwAd_0LOA1KrCkDoG3-yuxTcWKMApQwuQ/exec';
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('click', e => {
      // 這裡可以做預防重複點擊或其他前端驗證
    });

    form.addEventListener('submit', e => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = '寄送中...';

      // 透過 fetch 將表單資料送給 Google Apps Script
      fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(response => {
          statusMsg.textContent = '感謝您的填寫！表單已成功送出，我們將盡快與您聯繫。';
          form.reset();
          submitBtn.disabled = false;
          submitBtn.textContent = '送出';
        })
        .catch(error => {
          console.error('Error!', error.message);
          statusMsg.style.color = 'red';
          statusMsg.textContent = '發送失敗，請稍後再試。';
          submitBtn.disabled = false;
          submitBtn.textContent = '送出';
        });
    });
  </script>
</body>
</html>
